<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Cadastro: Estoque Fácil</title>
    <meta property="og title"
          content="Cadastro de produtos">
</head>

<body>
    <header role="banner">
            <a href="/">
                Usuario Logado </a>

        <h1 class="title">Cadastro de Produto</h1>
    </header>

<div class="flex-box"><div class="<container-box">
    <main role="main" class="content">

        <form class="form" role="form" action="/action_page">
            <label for="fname">Nome do produto</label>
                <input type="text" id="fname" name="Nome do Produto"><br>

            <label for="category">Categoria</label>
                <select id="category" name="Categoria">
                    <option value="perecível">Perecível</option>
                    <option value="higiene">Higiene</option>
                    <option value="outro">Outro</option>
                </select><br>

            <label for="lprice">Preço</label>
                <input type="number" id="lprice" name="Price" min="0" step="0.01"
                       placeholder="R$"><br>
            <label for="lcod"> Código </label>
                <input type="text" id="lcod"><br>
            <label hidden="until-found" for="lvenc">Data de Validate: </label>
                <input type="date" id="lvenc" ><br>

            <br><br>

            <input type="submit" value="Cadastrar">
        </form>
            <a href="/">Voltar</a>

    </main>
</div> </div>


    <footer role="contentinfo" class="rodape"> <span class="copyleft">&copy;</span> 2026 </footer>
</body>

</html>
