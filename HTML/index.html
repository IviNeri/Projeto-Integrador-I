<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Cadastro: Estoque Fácil</title>
    <meta property="og title"
          content="Cadastro de produtos">
</head>

<body>
    <header role="banner">
            <a href="/">
                Usuario Logado </a>

        <h1 class="title">Cadastro de Produto</h1>
    </header>

<div class="flex-box"><div class="<container-box">
    <main role="main" class="content">

        <form class="form" role="form" action="/action_page">
            <label for="fname"></label>
                <input type="text" id="fname" name="Nome do Produto" placeholder="Nome do produto"><br>

            <label for="category"></label>
                <select id="category" name="Categoria" >
                    <option value="" disabled selected hidden>Categoria</option>
                    <option value="perecível">Perecível</option>
                    <option value="higiene">Higiene</option>
                    <option value="outro">Outro</option>
                </select><br>

            <label for="lprice"></label>
                <input type="number" id="lprice" name="Price" min="0" step="0.01" placeholder="Preço"><br>
            <label for="lcod">  </label>
                <input type="text" id="lcod" placeholder="Código"><br>
            <label hidden="until-found" for="lvenc"></label>
                <input type="text"
                       placeholder="Data de Validate:"
                       onfocus="(this.type='date')"
                       onblur="(this.value=== '' ? this.type='text' : this.type.type='date')"
                id="lvenc"><br>

            <br><br><br>
        <div class="bottom">
            <input type="submit" value="Cadastrar"><br>

            <a href="/">Voltar</a>
        </div></form>

    </main>
</div> </div>


    <footer role="contentinfo" class="rodape"></footer>
</body>

</html>
